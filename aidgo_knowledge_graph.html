<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIDGO Knowledge Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:#1f2d45;
  --text:#e2e8f0;--muted:#64748b;--accent:#38bdf8;
  --cs:#22c55e;--ps:#f59e0b;--rt:#60a5fa;--cw:#ff6b35;--na:#ef4444;
  --legal:#fb923c;--tech:#2dd4bf;--coll:#a78bfa;--conc:#86efac;
  --conjreq:#67e8f9;--euconcept:#fbbf24;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:'Syne',sans-serif;overflow:hidden}

/* ── LAYOUT ─────────────────────────────────────────────── */
#app{display:grid;grid-template-columns:260px 1fr 300px;height:100vh;overflow:hidden}
#sidebar{background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden}
#canvas-wrap{position:relative;overflow:hidden;background:var(--bg)}
#detail{background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden}

/* ── SIDEBAR ─────────────────────────────────────────────── */
.brand{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.brand span{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;display:block;margin-top:2px}
.section-head{padding:10px 16px 6px;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sidebar-scroll{overflow-y:auto;flex:1;padding-bottom:12px}

/* Node type filters */
.filter-btn{display:flex;align-items:center;gap:8px;width:100%;padding:6px 16px;
  background:none;border:none;cursor:pointer;transition:background .1s;text-align:left}
.filter-btn:hover{background:var(--surface2)}
.filter-btn.off{opacity:.35}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.hex{width:10px;height:10px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);flex-shrink:0}
.dia{width:10px;height:10px;transform:rotate(45deg);flex-shrink:0}
.filter-label{font-size:11px;color:var(--text);font-family:'JetBrains Mono',monospace;flex:1}
.filter-count{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}

/* Alignment edge filters */
.edge-btn{display:flex;align-items:center;gap:8px;width:100%;padding:5px 16px;
  background:none;border:none;cursor:pointer;transition:background .1s}
.edge-btn:hover{background:var(--surface2)}
.edge-btn.off{opacity:.35}
.edge-line{width:22px;height:2px;border-radius:1px;flex-shrink:0}
.edge-label{font-size:11px;color:var(--text);font-family:'JetBrains Mono',monospace;flex:1}
.edge-count{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}

/* Search */
.search-wrap{padding:10px 16px;border-top:1px solid var(--border)}
.search-input{width:100%;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;
  outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--accent)}

/* Stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 16px 10px}
.stat-box{background:var(--surface2);border-radius:5px;padding:8px 10px}
.stat-n{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--accent)}
.stat-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/* Controls */
.ctrl-row{display:flex;gap:6px;padding:0 16px 10px}
.btn{padding:5px 10px;border-radius:5px;border:1px solid var(--border);
  background:var(--surface2);color:var(--muted);font-size:10px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.active{background:rgba(56,189,248,.12);border-color:var(--accent);color:var(--accent)}

/* ── CANVAS ──────────────────────────────────────────────── */
#kg-canvas{width:100%;height:100%}
.node{cursor:pointer}
.node circle,.node polygon{transition:r .15s,opacity .2s}
.node.highlighted circle,.node.highlighted polygon{filter:drop-shadow(0 0 6px currentColor)}
.node.faded{opacity:.12}
.link{fill:none;transition:opacity .2s;stroke-width:1.5}
.link.faded{opacity:.04}
.link.highlighted{stroke-width:2.5;opacity:1}
.link-cs{stroke:var(--cs)}
.link-ps{stroke:var(--ps)}
.link-rt{stroke:var(--rt)}
.link-cw{stroke:var(--cw)}
.link-na{stroke:var(--na);stroke-dasharray:4,3}
.link-decomp{stroke:#475569;stroke-dasharray:2,2;stroke-width:1}
.link-broader{stroke:#334155;stroke-width:1}
.link-uses{stroke:#1e3a5f;stroke-dasharray:3,4;stroke-width:1}
.node-label{font-size:8px;font-family:'JetBrains Mono',monospace;
  fill:var(--text);pointer-events:none;opacity:.7;text-anchor:middle}

/* Tooltip */
#tooltip{position:absolute;background:rgba(10,14,26,.96);border:1px solid var(--border);
  border-radius:6px;padding:10px 12px;pointer-events:none;max-width:240px;
  display:none;z-index:100;font-size:11px;line-height:1.6}
#tooltip .tt-id{font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:10px}
#tooltip .tt-type{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em}
#tooltip .tt-label{color:var(--text);margin:4px 0;font-weight:600;font-size:11px}

/* ── DETAIL PANEL ────────────────────────────────────────── */
.detail-head{padding:16px;border-bottom:1px solid var(--border)}
.detail-head h2{font-size:13px;font-weight:700;color:var(--accent)}
.detail-head span{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.detail-scroll{overflow-y:auto;flex:1;padding:12px}
.detail-empty{display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--muted);font-size:12px;text-align:center;padding:20px}
.prop-row{margin-bottom:12px}
.prop-key{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:3px}
.prop-val{font-size:11px;color:var(--text);line-height:1.55;
  background:var(--surface2);border-radius:4px;padding:6px 8px;word-break:break-word}
.prop-val.mono{font-family:'JetBrains Mono',monospace;color:var(--accent)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;
  font-family:'JetBrains Mono',monospace;font-weight:600}
.badge-cs{background:rgba(34,197,94,.15);color:var(--cs);border:1px solid rgba(34,197,94,.3)}
.badge-ps{background:rgba(245,158,11,.15);color:var(--ps);border:1px solid rgba(245,158,11,.3)}
.badge-rt{background:rgba(96,165,250,.15);color:var(--rt);border:1px solid rgba(96,165,250,.3)}
.badge-cw{background:rgba(255,107,53,.15);color:var(--cw);border:1px solid rgba(255,107,53,.3)}
.badge-na{background:rgba(239,68,68,.15);color:var(--na);border:1px solid rgba(239,68,68,.3)}
.connected-list{display:flex;flex-direction:column;gap:4px}
.connected-item{font-size:10px;font-family:'JetBrains Mono',monospace;
  color:var(--muted);padding:4px 8px;background:var(--surface2);border-radius:3px;
  cursor:pointer;transition:color .1s}
.connected-item:hover{color:var(--accent)}

/* CQ badge */
.cq-wrap{display:flex;flex-wrap:wrap;gap:4px}
.cq-badge{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 6px;
  border-radius:3px;background:rgba(56,189,248,.1);color:var(--accent);
  border:1px solid rgba(56,189,248,.2)}

/* Legend tag */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;
  font-family:'JetBrains Mono',monospace;color:var(--muted)}
</style>
</head>
<body>
<div id="app">

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="brand">
    <h1>AIDGO Knowledge Graph</h1>
    <span>ISO 5259-3 ↔ EU AI Act Art.10 · v2.0</span>
  </div>

  <div class="sidebar-scroll">
    <div class="section-head">Node Types</div>
    <div id="node-filters"></div>

    <div class="section-head" style="margin-top:8px">Alignment Edges</div>
    <div id="edge-filters"></div>

    <div class="section-head" style="margin-top:8px">Live Stats</div>
    <div class="stats-grid" id="stats-grid"></div>

    <div class="section-head" style="margin-top:4px">Controls</div>
    <div class="ctrl-row">
      <button class="btn active" id="btn-physics" onclick="togglePhysics()">⚡ Physics</button>
      <button class="btn" id="btn-labels" onclick="toggleLabels()">🏷 Labels</button>
      <button class="btn" onclick="resetCamera()">⌖ Reset</button>
    </div>
    <div class="ctrl-row">
      <button class="btn" onclick="exportSVG()" style="flex:1">⬇ Export SVG</button>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" class="search-input" id="search-input"
      placeholder="Search nodes… (ID or label)" oninput="onSearch(this.value)">
  </div>
</div>

<!-- CANVAS -->
<div id="canvas-wrap">
  <svg id="kg-canvas"></svg>
  <div id="tooltip">
    <div class="tt-type" id="tt-type"></div>
    <div class="tt-id" id="tt-id"></div>
    <div class="tt-label" id="tt-label"></div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div id="detail">
  <div class="detail-head">
    <h2 id="detail-title">Node Inspector</h2>
    <span id="detail-sub">Click any node to inspect</span>
  </div>
  <div class="detail-scroll" id="detail-body">
    <div class="detail-empty">
      Select a node in the graph to inspect its properties, connections, and alignment data.
    </div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
// ═══ DATA ════════════════════════════════════════════════════════════════════
const KG = {"concepts":[{"id":"dataLifeCycle","clause":"3.1","alt":"","label":"data life cycle","def":"All stages in the process of data usage from idea conception to its discontinuation.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataHolder","clause":"3.2","alt":"","label":"data holder","def":"Party that has legal control to authorize data processing of the data by other parties.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataUser","clause":"3.3","alt":"","label":"data user","def":"Party that is authorized to perform processing of data under the legal control of a data holder.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataQuality","clause":"3.4","alt":"","label":"data quality","def":"Degree to which a collection of characteristics of data fulfills requirements.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataQualityCharacteristic","clause":"3.5","alt":"","label":"data quality characteristic","def":"Category of data quality attributes that bears on data quality.","broader":"dataQuality","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataQualityModel","clause":"3.6","alt":"","label":"data quality model","def":"Defined set of characteristics with their sub-characteristics that provide a framework for specifying data quality requirements and evaluating data quality.","broader":"dataQuality","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataQualityMeasure","clause":"3.7","alt":"","label":"data quality measure","def":"Variable to which a value is assigned as the result of measurement of a data quality characteristic.","broader":"dataQualityCharacteristic","source":"ISO/IEC 5259-1","type":"concept"},{"id":"qualityRequirement","clause":"3.8","alt":"","label":"quality requirement","def":"Requirement for quality properties or attributes of a product, data or service.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"measurement","clause":"3.9","alt":"","label":"measurement","def":"Set of operations having the object of determining a value of a measure.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"measurementScale","clause":"3.10","alt":"quantity-value scale","label":"measurement scale","def":"Ordered set of quantity values used in ranking quantities of a given kind according to magnitude.","broader":"measurement","source":"ISO/IEC 5259-1","type":"concept"},{"id":"analytics","clause":"3.11","alt":"data analytics","label":"analytics","def":"Composite concept consisting of data acquisition, collection, validation, processing including quantification, visualisation, documentation and interpretation.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"attribute","clause":"3.12","alt":"","label":"attribute","def":"Property or characteristic of an object that can be distinguished quantitatively or qualitatively.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"feature","clause":"3.13","alt":"","label":"feature","def":"<machine learning> Measurable property of an object or event in the context of an analytics or ML task.","broader":"attribute","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataQualityManagement","clause":"3.14","alt":"","label":"data quality management","def":"Coordinated activities to direct and control an organisation with regard to data quality.","broader":"dataQuality","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataGovernance","clause":"3.15","alt":"","label":"data governance","def":"Property or ability for coordinated management of data asset management strategy, including policies, procedures, standards, and guidelines.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataProvenance","clause":"3.16","alt":"provenance","label":"data provenance","def":"Information on the place and time of origin, derivation or generation of a dataset.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"visualisation","clause":"3.17","alt":"scientific visualisation","label":"visualisation","def":"Representation of data in a visual form that enables a human to directly understand or interact with the data.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"mlProject","clause":"3.18","alt":"ML project","label":"machine learning project","def":"Project that utilizes analytics and machine learning and is responsible for the associated data throughout the data's entire life cycle.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataArchitecture","clause":"3.19","alt":"","label":"data architecture","def":"Design that describes the structure and arrangement of data and the processes for managing data at the organisation level.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataItem","clause":"3.20","alt":"","label":"data item","def":"Smallest identifiable unit of data within a certain context.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"dataRecord","clause":"3.21","alt":"","label":"data record","def":"Set of related data items treated as a unit.","broader":"dataItem","source":"ISO/IEC 5259-1","type":"concept"},{"id":"metadata","clause":"3.22","alt":"","label":"metadata","def":"Data that define and describe other data.","broader":"","source":"ISO/IEC 5259-1","type":"concept"},{"id":"boundingBox","clause":"3.1","alt":"","label":"bounding box","def":"Minimum n-dimensional rectangle aligned with the axes of a coordinate system that entirely contains an object.","broader":"","source":"ISO/IEC 5259-2","type":"concept"},{"id":"data","clause":"3.2","alt":"","label":"data","def":"Re-interpretable representation of information in a formalized manner suitable for communication, interpretation, or processing.","broader":"","source":"ISO/IEC 5259-2","type":"concept"},{"id":"dataset","clause":"3.3","alt":"","label":"dataset","def":"Collection of data with a shared format.","broader":"data","source":"ISO/IEC 5259-2","type":"concept"},{"id":"dataType","clause":"3.5","alt":"","label":"data type","def":"Categorisation of an abstract set of possible values, characteristics, and set of operations for an attribute.","broader":"dataItem","source":"ISO/IEC 5259-2","type":"concept"},{"id":"dataValue","clause":"3.6","alt":"","label":"data value","def":"Content of a data item.","broader":"dataItem","source":"ISO/IEC 5259-2","type":"concept"},{"id":"dataFrame","clause":"3.8","alt":"","label":"data frame","def":"Set of data records with a specific domain or purpose and the same data items, used for analytics and ML.","broader":"dataRecord","source":"ISO/IEC 5259-2","type":"concept"},{"id":"cluster","clause":"3.9","alt":"","label":"cluster","def":"Group of data having similar properties or characteristics as determined by a clustering algorithm.","broader":"dataset","source":"ISO/IEC 5259-2","type":"concept"},{"id":"emptyDataItem","clause":"3.10","alt":"","label":"empty data item","def":"Data item whose data value has no value, i.e. Null or None.","broader":"dataItem","source":"ISO/IEC 5259-2","type":"concept"},{"id":"measuredValue","clause":"3.14","alt":"","label":"measured value","def":"Value attributed to a data quality measure obtained by measurement.","broader":"dataQualityMeasure","source":"ISO/IEC 5259-2","type":"concept"},{"id":"measurementFunction","clause":"3.15","alt":"","label":"measurement function","def":"Algorithm or calculation performed to combine two or more quality measure elements.","broader":"measurement","source":"ISO/IEC 5259-2","type":"concept"},{"id":"overfitting","clause":"3.16","alt":"","label":"overfitting","def":"<machine learning> Creating a model which fits the training data too precisely and fails to generalise on new data.","broader":"","source":"ISO/IEC 5259-2","type":"concept"},{"id":"rawData","clause":"3.18","alt":"","label":"raw data","def":"Data in its originally acquired form from its source, before subsequent processing.","broader":"data","source":"ISO/IEC 5259-2","type":"concept"},{"id":"targetData","clause":"3.19","alt":"","label":"target data","def":"Data used in an analytics or ML task whose quality is measured.","broader":"data","source":"ISO/IEC 5259-2","type":"concept"},{"id":"organization","clause":"3-ref","alt":"","label":"organization","def":"Person or group of people that has its own functions with responsibilities, authorities and relationships to achieve its objectives.","broader":"","source":"ISO/IEC 5259-3","type":"concept"},{"id":"dataQualityManagementSystem","clause":"3-dqms","alt":"","label":"data quality management system","def":"Part of an organisation's management system which addresses data quality planning, control, assurance and improvement.","broader":"dataQualityManagement","source":"ISO/IEC 5259-3","type":"concept"},{"id":"dataQualityManagementLifeCycle","clause":"3-dqmlc","alt":"DQMLC","label":"data quality management life cycle","def":"Life cycle model providing guidance towards meeting quality requirements of data for analytics and ML with discrete stages for managing data quality.","broader":"dataLifeCycle","source":"ISO/IEC 5259-3","type":"concept"},{"id":"dataSpecificationDoc","clause":"3-ds","alt":"","label":"data specification","def":"Document specifying data requirements, validated to be consistent and complete for the intended use.","broader":"","source":"ISO/IEC 5259-3","type":"concept"},{"id":"dataQualityPlan","clause":"3-dqp","alt":"","label":"data quality plan","def":"Document covering processes, activities and resources required to meet the data specification throughout the data life cycle.","broader":"","source":"ISO/IEC 5259-3","type":"concept"},{"id":"dataAcquisition","clause":"3-da","alt":"","label":"data acquisition","def":"Process by which data are obtained, including collection, purchase, licensing, reuse or generation.","broader":"dataLifeCycle","source":"ISO/IEC 5259-3","type":"concept"},{"id":"dataPreprocessing","clause":"3-dp","alt":"","label":"data preprocessing","def":"Processes applied to acquired data to improve its quality towards meeting the data specification.","broader":"dataLifeCycle","source":"ISO/IEC 5259-3","type":"concept"},{"id":"dataAugmentation","clause":"3-daug","alt":"","label":"data augmentation","def":"Processes that increase the diversity or quantity of data in a dataset in a controlled manner to meet the data specification.","broader":"dataLifeCycle","source":"ISO/IEC 5259-3","type":"concept"},{"id":"dataProvisioning","clause":"3-dprov","alt":"","label":"data provisioning","def":"Process by which auditable data and metadata are delivered to users, meeting all specified requirements.","broader":"dataLifeCycle","source":"ISO/IEC 5259-3","type":"concept"},{"id":"dataDecommissioning","clause":"3-ddecom","alt":"","label":"data decommissioning","def":"Process of retiring data either through transfer to a qualified recipient or deletion.","broader":"dataLifeCycle","source":"ISO/IEC 5259-3","type":"concept"},{"id":"qualityGate","clause":"3-qg","alt":"","label":"data life cycle quality gate","def":"Objectively assessable quality target for work products at each stage of the DQMLC; a stage shall only be entered with verified and validated input.","broader":"","source":"ISO/IEC 5259-3","type":"concept"},{"id":"configurationManagement","clause":"3-cm","alt":"","label":"configuration management","def":"Planned and maintained activity defining requirements for uniquely identified and reproducible items produced or used during the data life cycle.","broader":"","source":"ISO/IEC 5259-3","type":"concept"},{"id":"changeManagement","clause":"3-chm","alt":"","label":"change management","def":"Planned and initiated process before any change to data, requirements or processes to ensure all impacts are assessed and approved.","broader":"","source":"ISO/IEC 5259-3","type":"concept"},{"id":"riskManagement","clause":"3-rm","alt":"","label":"risk management (data quality)","def":"Coordinated activities to ensure all risks to data quality are accounted for, assessed and if necessary mitigated.","broader":"","source":"ISO/IEC 5259-3","type":"concept"},{"id":"stakeholder","clause":"3-sh","alt":"","label":"stakeholder","def":"Person or organisation that can affect, be affected by, or perceive itself to be affected by a decision or activity related to data quality.","broader":"","source":"ISO/IEC 5259-3","type":"concept"},{"id":"verificationAndValidation","clause":"3-vv","alt":"V&V","label":"verification and validation","def":"Processes that monitor and assess data quality throughout all stages of the DQMLC using measurable quality criteria.","broader":"","source":"ISO/IEC 5259-3","type":"concept"},{"id":"dataQualityImprovement","clause":"4-dqi","alt":"","label":"data quality improvement","def":"Application of data transformations to a dataset to improve its quality to the extent it meets the organisation's needs.","broader":"dataQualityManagement","source":"ISO/IEC 5259-4","type":"concept"},{"id":"dataQualityAssessment","clause":"4-dqa","alt":"","label":"data quality assessment","def":"Use of data quality measures to evaluate whether a dataset meets the organisation's needs.","broader":"dataQualityManagement","source":"ISO/IEC 5259-4","type":"concept"},{"id":"dataQualityReport","clause":"4-dqr","alt":"","label":"data quality report","def":"Document expressing data quality requirements, measures, results of measurements, and an assessment of whether data meets requirements.","broader":"","source":"ISO/IEC 5259-4","type":"concept"},{"id":"dataLabelling","clause":"4-dl","alt":"data annotation","label":"data labelling","def":"Process of assigning values for target variables to training, validation and testing data for supervised ML.","broader":"dataPreprocessing","source":"ISO/IEC 5259-4","type":"concept"},{"id":"dataTransformation","clause":"4-dt","alt":"","label":"data transformation","def":"Converting data from one representation or space to another with minimal loss of content.","broader":"dataPreprocessing","source":"ISO/IEC 5259-4","type":"concept"},{"id":"dataPrivacy","clause":"4-dpriv","alt":"","label":"data privacy","def":"Protection of personally identifiable information (PII) in datasets during data quality processes.","broader":"","source":"ISO/IEC 5259-4","type":"concept"},{"id":"dataInteroperability","clause":"4-di","alt":"","label":"data interoperability","def":"Ability of data from one system to be understood and used by another system without special effort.","broader":"","source":"ISO/IEC 5259-4","type":"concept"},{"id":"groundTruth","clause":"4-gt","alt":"","label":"ground truth","def":"Data label or annotation that is assumed to be correct or accurate for use as training or testing data.","broader":"dataLabelling","source":"ISO/IEC 5259-4","type":"concept"},{"id":"dataSampling","clause":"4-ds","alt":"","label":"data sampling","def":"Process of selecting a subset of data from a dataset according to a defined method.","broader":"dataPreprocessing","source":"ISO/IEC 5259-4","type":"concept"},{"id":"dataAnnotation","clause":"4-dan","alt":"annotation","label":"data annotation","def":"Process of adding metadata or labels to raw data to make it meaningful for ML training.","broader":"dataLabelling","source":"ISO/IEC 5259-4","type":"concept"},{"id":"trainingData","clause":"5-td","alt":"","label":"training data","def":"Data used to train an ML algorithm to produce a trained ML model.","broader":"targetData","source":"ISO/IEC 5259-5","type":"concept"},{"id":"validationData","clause":"5-vd","alt":"","label":"validation data","def":"Data used to provide an evaluation of the trained ML model and for tuning its non-learnable parameters to prevent underfitting or overfitting.","broader":"targetData","source":"ISO/IEC 5259-5","type":"concept"},{"id":"testData","clause":"5-testd","alt":"","label":"test data","def":"Data used to evaluate the final performance of a trained ML model independently of training.","broader":"targetData","source":"ISO/IEC 5259-5","type":"concept"},{"id":"productionData","clause":"5-pd","alt":"","label":"production data","def":"Data provided to a deployed ML model in the operational environment.","broader":"targetData","source":"ISO/IEC 5259-5","type":"concept"},{"id":"representativeness","clause":"5-rep","alt":"","label":"representativeness","def":"Degree to which the statistical properties of a dataset reflect those of the target population for the intended use.","broader":"dataQualityCharacteristic","source":"ISO/IEC 5259-5","type":"concept"},{"id":"dataBias","clause":"5-db","alt":"","label":"data bias","def":"Systematic deviation in data from a true value or representation of the target population, potentially leading to unfair or inaccurate outcomes.","broader":"dataQualityCharacteristic","source":"ISO/IEC 5259-5","type":"concept"},{"id":"dataDrift","clause":"5-dd","alt":"","label":"data drift","def":"Change over time in the statistical properties of data used in analytics or ML that can degrade model performance.","broader":"dataQualityCharacteristic","source":"ISO/IEC 5259-5","type":"concept"},{"id":"dataCompleteness","clause":"5-dc","alt":"","label":"data completeness","def":"Degree to which all required data items are present in a dataset and have defined, non-empty values.","broader":"dataQualityCharacteristic","source":"ISO/IEC 5259-5","type":"concept"},{"id":"dataAccuracy","clause":"5-acc","alt":"","label":"data accuracy","def":"Degree to which data correctly represents the real-world values it is intended to model.","broader":"dataQualityCharacteristic","source":"ISO/IEC 5259-5","type":"concept"},{"id":"dataConsistency","clause":"5-con","alt":"","label":"data consistency","def":"Degree to which data is free from contradictions and coherent within a dataset and across related datasets.","broader":"dataQualityCharacteristic","source":"ISO/IEC 5259-5","type":"concept"},{"id":"dataCurrentness","clause":"5-cur","alt":"timeliness","label":"data currentness","def":"Degree to which data represents the current state of the phenomenon it models at a given point in time.","broader":"dataQualityCharacteristic","source":"ISO/IEC 5259-5","type":"concept"},{"id":"dataRelevance","clause":"5-rel","alt":"","label":"data relevance","def":"Degree to which data is applicable and useful for the specified analytics or ML purpose.","broader":"dataQualityCharacteristic","source":"ISO/IEC 5259-5","type":"concept"},{"id":"dataBalance","clause":"5-bal","alt":"","label":"data balance","def":"Degree to which the distribution of values across categories in a dataset reflects the intended distribution for the ML task.","broader":"dataQualityCharacteristic","source":"ISO/IEC 5259-5","type":"concept"}],"collections":[{"id":"AidgoContextOfOrganizationReqColl","clause":"4","label":"Context of the organization","def":"","broader":"","collection":"","type":"collection"},{"id":"AidgoLeadershipReqColl","clause":"5","label":"Leadership","def":"","broader":"","collection":"","type":"collection"},{"id":"AidgoPlanningReqColl","clause":"6","label":"Planning (DQM System)","def":"","broader":"","collection":"","type":"collection"},{"id":"AidgoDataQualityCultureReqColl","clause":"6.3.2","label":"Data quality culture","def":"Requirements for the organisation to establish and sustain a data quality culture.","broader":"AidgoPlanningReqColl","collection":"","type":"collection"},{"id":"AidgoDataQualityIssuesMgmtReqColl","clause":"6.3.3","label":"Management of data quality issues","def":"Requirements for processes to communicate, analyse, evaluate, resolve and close data quality issues.","broader":"AidgoPlanningReqColl","collection":"","type":"collection"},{"id":"AidgoCompetenceMgmtReqColl","clause":"6.3.4","label":"Competence management","def":"Requirements for managing skills and competence of persons involved in DQM activities.","broader":"AidgoPlanningReqColl","collection":"","type":"collection"},{"id":"AidgoResourceMgmtReqColl","clause":"6.3.5","label":"Resource management","def":"Requirements for providing sufficient reso Data handling \u2014 processes","def":"The organization shall specify processes for data handling, including storage, access control, format conversion and integrity checking.","broader":"","collection":"AidgoDataHandlingReqColl","type":"requirement"},{"id":"AidgoReq_7_3_5_1","clause":"7.3.5.1","label":"Data preprocessing \u2014 specify processes","def":"The organization shall specify data preprocessing processes to meet the data specification and include them in the data quality plan.","broader":"","collection":"AidgoDataPreprocessingReqColl","type":"requirement"},{"id":"AidgoReq_7_3_5_2","clause":"7.3.5.2","label":"Data cleaning","def":"The organization shall specify data quality measures to be applied for cleaning, including measures for: a) missing data items; b) duplication; c) outliers; d) bias and drift; e) non-standard or inval","broader":"","collection":"AidgoDataCleaningReqColl","type":"requirement"},{"id":"AidgoReq_7_3_6_1","clause":"7.3.6.1","label":"Data augmentation \u2014 specify processes","def":"The organization shall specify data augmentation processes to meet the data specification and include them in the data quality plan.","broader":"","collection":"AidgoDataAugmentationReqColl","type":"requirement"},{"id":"AidgoReq_7_3_7_1","clause":"7.3.7.1","label":"Data provisioning General","def":"The organization shall: a) specify data provisioning processes to meet the data specification; b) provide auditable evidence that provisioned data meets all specified data quality requirements; c) ens","broader":"","collection":"AidgoDataProvisioningReqColl","type":"requirement"},{"id":"AidgoReq_7_3_7_3","clause":"7.3.7.3","label":"Data provisioning documentation","def":"Documentation provisioned with data shall include: a) scope of use and intended purpose; b) instructions for use; c) statistical properties of the dataset; d) description of each data item; e) list of","broader":"","collection":"AidgoDataProvisioningDocReqColl","type":"requirement"},{"id":"AidgoReq_7_3_7_4_R1","clause":"7.3.7.4","label":"Tracking \u2014 data usage monitoring","def":"The organization shall monitor the use of provisioned data to detect any degradation of data quality or deviations from the intended use.","broader":"","collection":"AidgoTrackingImprovementReqColl","type":"requirement"},{"id":"AidgoReq_7_3_7_4_R2","clause":"7.3.7.4","label":"Tracking \u2014 corrective actions","def":"The organization shall define and apply corrective actions when deviations or degradation are detected.","broader":"","collection":"AidgoTrackingImprovementReqColl","type":"requirement"},{"id":"AidgoReq_7_3_7_4_R3","clause":"7.3.7.4","label":"Tracking \u2014 improvement feedback","def":"The organization shall use tracking results as feedback to improve data quality planning and acquisition processes.","broader":"","collection":"AidgoTrackingImprovementReqColl","type":"requirement"},{"id":"AidgoReq_7_3_7_5","clause":"7.3.7.5","label":"Data optimization","def":"The organization shall specify data optimization processes that: a) reduce storage and computational overhead without reducing quality below specified thresholds; b) apply only transformations that ar","broader":"","collection":"AidgoDataOptimizationReqColl","type":"requirement"},{"id":"AidgoReq_7_3_7_6_R1","clause":"7.3.7.6","label":"Support commitment \u2014 specify","def":"The organization shall specify the support it will provide for provisioned data, including the duration of support and conditions for termination.","broader":"","collection":"AidgoSupportCommitmentReqColl","type":"requirement"},{"id":"AidgoReq_7_3_7_6_R2","clause":"7.3.7.6","label":"Support commitment \u2014 documentation","def":"The organization shall document all support commitments in a support agreement that covers: a) scope of support; b) response times and service levels; c) versioning and update policy; d) conditions fo","broader":"","collection":"AidgoSupportCommitmentReqColl","type":"requirement"},{"id":"AidgoReq_7_3_8_1","clause":"7.3.8.1","label":"Data decommissioning \u2014 choose method","def":"The organization shall choose an appropriate method to decommission the data either through data deletion or through data transfer to a qualified recipient.","broader":"","collection":"AidgoDataDecommissioningReqColl","type":"requirement"},{"id":"AidgoReq_7_3_8_1_R2","clause":"7.3.8.1","label":"Data decommissioning \u2014 specify processes","def":"The organization shall specify data decommissioning processes in the data quality plan, including the schedule and criteria for decommissioning.","broader":"","collection":"AidgoDataDecommissioningReqColl","type":"requirement"},{"id":"AidgoReq_7_3_8_2","clause":"7.3.8.2","label":"Data transfer \u2014 conditions","def":"When transferring data, the organization shall ensure that the recipient meets the data quality requirements and has the authority to receive the data.","broader":"","collection":"AidgoDataTransferReqColl","type":"requirement"},{"id":"AidgoReq_7_3_8_3_R1","clause":"7.3.8.3","label":"Data deletion \u2014 from all storage","def":"When deleting data, the organization shall ensure that data is deleted from all storage locations, including backups and replicas.","broader":"","collection":"AidgoDataDeletionReqColl","type":"requirement"},{"id":"AidgoReq_7_3_8_3_R2","clause":"7.3.8.3","label":"Data deletion \u2014 legal obligations","def":"The organization shall ensure that data deletion does not violate applicable legal, contractual or regulatory obligations.","broader":"","collection":"AidgoDataDeletionReqColl","type":"requirement"},{"id":"AidgoReq_7_3_8_3_R3","clause":"7.3.8.3","label":"Data deletion \u2014 confirmation","def":"The organization shall document confirmation that data has been deleted from all locations.","broader":"","collection":"AidgoDataDeletionReqColl","type":"requirement"},{"id":"AidgoReq_7_3_8_4_R1","clause":"7.3.8.4","label":"Partial deletion \u2014 identify scope","def":"When partial data deletion is requested, the organization shall identify the exact scope of data items to be deleted.","broader":"","collection":"AidgoPartialDeletionReqColl","type":"requirement"},{"id":"AidgoReq_7_3_8_4_R2","clause":"7.3.8.4","label":"Partial deletion \u2014 impact assessment","def":"The organization shall assess the impact of partial deletion on the remaining dataset quality.","broader":"","collection":"AidgoPartialDeletionReqColl","type":"requirement"},{"id":"AidgoReq_7_3_8_4_R3","clause":"7.3.8.4","label":"Partial deletion \u2014 execute and confirm","def":"The organization shall execute the partial deletion and confirm that the requested data items have been removed.","broader":"","collection":"AidgoPartialDeletionReqColl","type":"requirement"},{"id":"AidgoReq_8_2","clause":"8.2","label":"Horizontal processes General","def":"The organization shall apply the horizontal processes (verification and validation, configuration management, change management, and risk management) across all stages of the DQMLC.","broader":"","collection":"AidgoHorizontalGeneralReqColl","type":"requirement"},{"id":"AidgoReq_8_3_1_1_R1","clause":"8.3.1.1","label":"V&V \u2014 apply throughout","def":"The organization shall apply verification and validation processes throughout all stages of the DQMLC.","broader":"","collection":"AidgoVVReqColl","type":"requirement"},{"id":"AidgoReq_8_3_1_1_R2","clause":"8.3.1.1","label":"V&V \u2014 independent personnel","def":"Verification and validation activities shall be performed by personnel with appropriate independence from the activities being verified or validated.","broader":"","collection":"AidgoVVReqColl","type":"requirement"},{"id":"AidgoReq_8_3_1_2_R1","clause":"8.3.1.2","label":"Quality gates \u2014 define criteria","def":"The organization shall define quality gate criteria for each DQMLC stage in the data quality plan.","broader":"","collection":"AidgoQualityGatesReqColl","type":"requirement"},{"id":"AidgoReq_8_3_1_2_R2","clause":"8.3.1.2","label":"Quality gates \u2014 enforce progression","def":"A DQMLC stage shall only be entered when all quality gate criteria for the preceding stage have been met and documented.","broader":"","collection":"AidgoQualityGatesReqColl","type":"requirement"},{"id":"AidgoReq_8_3_1_2_R3","clause":"8.3.1.2","label":"Quality gates \u2014 deviations","def":"Any deviation from quality gate criteria shall be documented with a justification and approved by appropriate authority before progression.","broader":"","collection":"AidgoQualityGatesReqColl","type":"requirement"},{"id":"AidgoReq_8_3_1_2_R4","clause":"8.3.1.2","label":"Quality gates \u2014 objectively measurable","def":"Quality gate criteria shall be objectively measurable using defined data quality measures.","broader":"","collection":"AidgoQualityGatesReqColl","type":"requirement"},{"id":"AidgoReq_8_3_2_R1","clause":"8.3.2","label":"Configuration management \u2014 identify items","def":"The organization shall identify all configuration items (data, data specifications, plans, tools, and work products) subject to configuration management.","broader":"","collection":"AidgoConfigMgmtReqColl","type":"requirement"},{"id":"AidgoReq_8_3_2_R2","clause":"8.3.2","label":"Configuration management \u2014 version control","def":"The organization shall implement version control for all configuration items to ensure traceability and reproducibility.","broader":"","collection":"AidgoConfigMgmtReqColl","type":"requirement"},{"id":"AidgoReq_8_3_2_R3","clause":"8.3.2","label":"Configuration management \u2014 baseline","def":"The organization shall establish and maintain baselines for configuration items at defined DQMLC milestones.","broader":"","collection":"AidgoConfigMgmtReqColl","type":"requirement"},{"id":"AidgoReq_8_3_2_R4","clause":"8.3.2","label":"Configuration management \u2014 status accounting","def":"The organization shall maintain records of the status of all configuration items throughout the DQMLC.","broader":"","collection":"AidgoConfigMgmtReqColl","type":"requirement"},{"id":"AidgoReq_8_3_3_2","clause":"8.3.3.2","label":"Change management planning","def":"The organization shall establish and maintain a change management process that ensures all changes to data, requirements or processes are assessed and approved before implementation.","broader":"","collection":"AidgoChangeMgmtReqColl","type":"requirement"},{"id":"AidgoReq_8_3_3_3","clause":"8.3.3.3","label":"Change request specification","def":"Each change request shall specify: a) the data item or process affected; b) the reason for the change; c) the proposed change; d) the requestor and date.","broader":"","collection":"AidgoChangeRequestSpecReqColl","type":"requirement"},{"id":"AidgoReq_8_3_3_4","clause":"8.3.3.4","label":"Change request analysis","def":"Change requests shall be analysed to determine: a) impact on data quality; b) impact on dependent datasets, processes and plans; c) risks introduced by the change; d) alternative solutions; e) resourc","broader":"","collection":"AidgoChangeRequestAnalysisReqColl","type":"requirement"},{"id":"AidgoReq_8_3_3_5","clause":"8.3.3.5","label":"Change request evaluation and approval","def":"Change requests shall be evaluated and: a) approved, with conditions if necessary; b) deferred to a later stage; c) rejected with justification.","broader":"","collection":"AidgoChangeRequestEvalReqColl","type":"requirement"},{"id":"AidgoReq_8_3_3_6_R1","clause":"8.3.3.6","label":"Change implementation \u2014 implement","def":"Approved changes shall be implemented in accordance with the approved change request and all affected configuration items shall be updated.","broader":"","collection":"AidgoChangeDocumentationReqColl","type":"requirement"},{"id":"AidgoReq_8_3_3_6_R2","clause":"8.3.3.6","label":"Change implementation \u2014 verify","def":"The organization shall verify that the implemented change achieves the intended objective without introducing unacceptable side effects.","broader":"","collection":"AidgoChangeDocumentationReqColl","type":"requirement"},{"id":"AidgoReq_8_3_4_R1","clause":"8.3.4.2","label":"Risk management \u2014 conduct assessment","def":"The organization shall conduct a risk assessment and maintain documentation with respect to risks associated to data quality.","broader":"","collection":"AidgoRiskManagementReqColl","type":"requirement"},{"id":"AidgoReq_8_3_4_R2","clause":"8.3.4.2","label":"Risk management \u2014 minimise risks","def":"The organization shall manage and maintain appropriate processes to minimise identified risks. Risks shall be specified, justified and documented.","broader":"","collection":"AidgoRiskManagementReqColl","type":"requirement"},{"id":"AidgoReq_8_3_4_R3","clause":"8.3.4.2","label":"Risk management \u2014 monitor","def":"The organization shall monitor identified risks throughout the DQMLC and update the risk assessment when the risk environment changes.","broader":"","collection":"AidgoRiskManagementReqColl","type":"requirement"},{"id":"AidgoReq_8_3_4_R4","clause":"8.3.4.2","label":"Risk management \u2014 communicate","def":"The organization shall communicate significant data quality risks to relevant stakeholders.","broader":"","collection":"AidgoRiskManagementReqColl","type":"requirement"},{"id":"AidgoReq_10_2","clause":"10.2","label":"Data processing tools \u2014 management","def":"The organization shall manage data processing tools to ensure they support data quality requirements, covering: a) approved tool list with version information; b) tool qualification and validation; c)","broader":"","collection":"AidgoDataProcessingToolsReqColl","type":"requirement"},{"id":"AidgoReq_11_2","clause":"11.2","label":"Data quality dependencies \u2014 management","def":"The organization shall manage data quality dependencies by: a) identifying all data quality dependencies between datasets and processes; b) documenting the impact of dependency failures on data qualit","broader":"","collection":"AidgoDQDependenciesReqColl","type":"requirement"}],"conjReqs":[{"id":"AidgoConjReq_6.3.2_Ra","clause":"6.3.2","label":"Data quality culture \u2014 a","def":"[The organization should sustain a data quality culture. The organization shall:] have rules and processes to achieve quality (according to this document) taking into account the data quality model as","broader":"AidgoReq_6_3_2","collection":"AidgoDataQualityCultureReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_2"},{"id":"AidgoConjReq_6.3.2_Rb","clause":"6.3.2","label":"Data quality culture \u2014 b","def":"[The organization should sustain a data quality culture. The organization shall:] define and implement data quality management processes, and performing related data quality activities","broader":"AidgoReq_6_3_2","collection":"AidgoDataQualityCultureReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_2"},{"id":"AidgoConjReq_6.3.2_Rc","clause":"6.3.2","label":"Data quality culture \u2014 c","def":"[The organization should sustain a data quality culture. The organization shall:] integrate the data quality management processes and activities, to the extent appropriate, into other management proce","broader":"AidgoReq_6_3_2","collection":"AidgoDataQualityCultureReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_2"},{"id":"AidgoConjReq_6.3.2_Rd","clause":"6.3.2","label":"Data quality culture \u2014 d","def":"[The organization should sustain a data quality culture. The organization shall:] document the performed activities","broader":"AidgoReq_6_3_2","collection":"AidgoDataQualityCultureReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_2"},{"id":"AidgoConjReq_6.3.2_Re","clause":"6.3.2","label":"Data quality culture \u2014 e","def":"[The organization should sustain a data quality culture. The organization shall:] provide resources sufficient to perform data quality management","broader":"AidgoReq_6_3_2","collection":"AidgoDataQualityCultureReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_2"},{"id":"AidgoConjReq_6.3.2_Rf","clause":"6.3.2","label":"Data quality culture \u2014 f","def":"[The organization should sustain a data quality culture. The organization shall:] monitor, and to the extent necessary, review and improve the data quality management processes","broader":"AidgoReq_6_3_2","collection":"AidgoDataQualityCultureReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_2"},{"id":"AidgoConjReq_6.3.2_Rg","clause":"6.3.2","label":"Data quality culture \u2014 g","def":"[The organization should sustain a data quality culture. The organization shall:] provide the required authority to involved personnel","broader":"AidgoReq_6_3_2","collection":"AidgoDataQualityCultureReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_2"},{"id":"AidgoConjReq_6.3.2_Rh","clause":"6.3.2","label":"Data quality culture \u2014 h","def":"[The organization should sustain a data quality culture. The organization shall:] communicate data quality policies within the organization","broader":"AidgoReq_6_3_2","collection":"AidgoDataQualityCultureReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_2"},{"id":"AidgoConjReq_6.3.3_Ra","clause":"6.3.3","label":"DQ issues management \u2014 a","def":"[The organization shall meet data quality requirements. The organization shall:] have processes for communicating, analysing, evaluating, resolving and closing (implementing a resolution or giving a r","broader":"AidgoReq_6_3_3","collection":"AidgoDataQualityIssuesMgmtReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_3"},{"id":"AidgoConjReq_6.3.3_Rb","clause":"6.3.3","label":"DQ issues management \u2014 b","def":"[The organization shall meet data quality requirements. The organization shall:] document closed issues","broader":"AidgoReq_6_3_3","collection":"AidgoDataQualityIssuesMgmtReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_3"},{"id":"AidgoConjReq_6.3.3_Rc","clause":"6.3.3","label":"DQ issues management \u2014 c","def":"[The organization shall meet data quality requirements. The organization shall:] escalate issues that cannot be closed","broader":"AidgoReq_6_3_3","collection":"AidgoDataQualityIssuesMgmtReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_3"},{"id":"AidgoConjReq_6.3.4_Ra","clause":"6.3.4","label":"Competence management \u2014 a","def":"[The organization shall manage competence. The organization shall:] document required skills and tools to process the data","broader":"AidgoReq_6_3_4","collection":"AidgoCompetenceMgmtReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_4"},{"id":"AidgoConjReq_6.3.4_Rb","clause":"6.3.4","label":"Competence management \u2014 b","def":"[The organization shall manage competence. The organization shall:] ensure that involved persons have sufficient skills to perform their activities and duties","broader":"AidgoReq_6_3_4","collection":"AidgoCompetenceMgmtReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_4"},{"id":"AidgoConjReq_6.3.4_Rc","clause":"6.3.4","label":"Competence management \u2014 c","def":"[The organization shall manage competence. The organization shall:] maintain proof of sufficient skill with the data quality system","broader":"AidgoReq_6_3_4","collection":"AidgoCompetenceMgmtReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_4"},{"id":"AidgoConjReq_6.3.4_Rd","clause":"6.3.4","label":"Competence management \u2014 d","def":"[The organization shall manage competence. The organization shall:] keep appropriate records of training and experience that substantiate claims of competency","broader":"AidgoReq_6_3_4","collection":"AidgoCompetenceMgmtReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_4"},{"id":"AidgoConjReq_6.3.5_Ra","clause":"6.3.5","label":"Resource management \u2014 a","def":"[The organization shall provide the resources required for data quality management, including:] appropriate software licenses and technical support for required tools","broader":"AidgoReq_6_3_5","collection":"AidgoResourceMgmtReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_5"},{"id":"AidgoConjReq_6.3.5_Rb","clause":"6.3.5","label":"Resource management \u2014 b","def":"[The organization shall provide the resources required for data quality management, including:] required IT infrastructure or services to meet the storage and compute requirements","broader":"AidgoReq_6_3_5","collection":"AidgoResourceMgmtReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_5"},{"id":"AidgoConjReq_6.3.5_Rc","clause":"6.3.5","label":"Resource management \u2014 c","def":"[The organization shall provide the resources required for data quality management, including:] availability of skilled persons","broader":"AidgoReq_6_3_5","collection":"AidgoResourceMgmtReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_5"},{"id":"AidgoConjReq_6.3.8_Ra","clause":"6.3.8","label":"DQ audit \u2014 a","def":"[The implemented processes shall be audited. The audit shall:] evaluate the data quality plan against the organizational rules and processes for data quality","broader":"AidgoReq_6_3_8","collection":"AidgoDataQualityAuditReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_8"},{"id":"AidgoConjReq_6.3.8_Rb","clause":"6.3.8","label":"DQ audit \u2014 b","def":"[The implemented processes shall be audited. The audit shall:] determine whether planned activities have been implemented and maintained effectively","broader":"AidgoReq_6_3_8","collection":"AidgoDataQualityAuditReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_8"},{"id":"AidgoConjReq_6.3.8_Rc","clause":"6.3.8","label":"DQ audit \u2014 c","def":"[The implemented processes shall be audited. The audit shall:] identify non-compliances and propose corrective actions","broader":"AidgoReq_6_3_8","collection":"AidgoDataQualityAuditReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_8"},{"id":"AidgoConjReq_6.3.8_Rd","clause":"6.3.8","label":"DQ audit \u2014 d","def":"[The implemented processes shall be audited. The audit shall:] document audit findings and conclusions","broader":"AidgoReq_6_3_8","collection":"AidgoDataQualityAuditReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_8"},{"id":"AidgoConjReq_6.3.8_Re","clause":"6.3.8","label":"DQ audit \u2014 e","def":"[The implemented processes shall be audited. The audit shall:] communicate findings to relevant stakeholders","broader":"AidgoReq_6_3_8","collection":"AidgoDataQualityAuditReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_8"},{"id":"AidgoConjReq_6.3.9_Ra","clause":"6.3.9","label":"Confirmation review \u2014 a","def":"[Data quality shall be confirmed. All work products shall undergo confirmation reviews that:] confirm that work products meet the data specification","broader":"AidgoReq_6_3_9","collection":"AidgoConfirmationReviewReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_9"},{"id":"AidgoConjReq_6.3.9_Rb","clause":"6.3.9","label":"Confirmation review \u2014 b","def":"[Data quality shall be confirmed. All work products shall undergo confirmation reviews that:] confirm that data quality measures have been applied correctly","broader":"AidgoReq_6_3_9","collection":"AidgoConfirmationReviewReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_9"},{"id":"AidgoConjReq_6.3.9_Rc","clause":"6.3.9","label":"Confirmation review \u2014 c","def":"[Data quality shall be confirmed. All work products shall undergo confirmation reviews that:] identify any remaining open issues","broader":"AidgoReq_6_3_9","collection":"AidgoConfirmationReviewReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_9"},{"id":"AidgoConjReq_6.3.9_Rd","clause":"6.3.9","label":"Confirmation review \u2014 d","def":"[Data quality shall be confirmed. All work products shall undergo confirmation reviews that:] authorise progression to the next life cycle stage","broader":"AidgoReq_6_3_9","collection":"AidgoConfirmationReviewReqColl","type":"conjreq","decomposes":"AidgoReq_6_3_9"},{"id":"AidgoConjReq_6.3.10_Ra","clause":"6.3.10","label":"Project-specific DQM \u2014 a","def":"[The organization shall manage project-specific data. The organization shall:] establish a suitable project-specific DQM process","broader":"AidgoReq_6_3_10","collection":  shall conduct stakeholder analysis. The organization shall:] identify all stakeholders relevant to the data and the intended use","broader":"AidgoReq_7_3_1_2","collection":"AidgoStakeholderAnalysisReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_1_2"},{"id":"AidgoConjReq_7.3.1.2_Rb","clause":"7.3.1.2","label":"Stakeholder analysis \u2014 b","def":"[The organization shall conduct stakeholder analysis. The organization shall:] document stakeholder data quality requirements and expectations","broader":"AidgoReq_7_3_1_2","collection":"AidgoStakeholderAnalysisReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_1_2"},{"id":"AidgoConjReq_7.3.2.2_Ra","clause":"7.3.2.2","label":"Data format \u2014 a","def":"[The data specification shall include the following format specifications:] the data type(s) of each data item","broader":"AidgoReq_7_3_2_2","collection":"AidgoDataFormatReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_2_2"},{"id":"AidgoConjReq_7.3.2.2_Rb","clause":"7.3.2.2","label":"Data format \u2014 b","def":"[The data specification shall include the following format specifications:] the allowed range or set of values for each data item","broader":"AidgoReq_7_3_2_2","collection":"AidgoDataFormatReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_2_2"},{"id":"AidgoConjReq_7.3.2.2_Rc","clause":"7.3.2.2","label":"Data format \u2014 c","def":"[The data specification shall include the following format specifications:] the encoding and representation standards","broader":"AidgoReq_7_3_2_2","collection":"AidgoDataFormatReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_2_2"},{"id":"AidgoConjReq_7.3.2.2_Rd","clause":"7.3.2.2","label":"Data format \u2014 d","def":"[The data specification shall include the following format specifications:] the unit of measurement for quantitative data items","broader":"AidgoReq_7_3_2_2","collection":"AidgoDataFormatReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_2_2"},{"id":"AidgoConjReq_7.3.2.2_Re","clause":"7.3.2.2","label":"
