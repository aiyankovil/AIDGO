idgoReq_7_3_7_3","collection":"AidgoDataProvisioningDocReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_7_3"},{"id":"AidgoConjReq_7.3.7.3_Rj","clause":"7.3.7.3","label":"Provisioning docs \u2014 j","def":"[Documentation provisioned with data shall include:] communication strategy for updates and issue reporting","broader":"AidgoReq_7_3_7_3","collection":"AidgoDataProvisioningDocReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_7_3"},{"id":"AidgoConjReq_7.3.7.5_Ra","clause":"7.3.7.5","label":"Data optimization \u2014 a","def":"[The organization shall specify data optimization processes that:] reduce storage and computational overhead without reducing quality below specified thresholds","broader":"AidgoReq_7_3_7_5","collection":"AidgoDataOptimizationReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_7_5"},{"id":"AidgoConjReq_7.3.7.5_Rb","clause":"7.3.7.5","label":"Data optimization \u2014 b","def":"[The organization shall specify data optimization processes that:] apply only transformations that are documented and reversible or justified","broader":"AidgoReq_7_3_7_5","collection":"AidgoDataOptimizationReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_7_5"},{"id":"AidgoConjReq_7.3.7.5_Rc","clause":"7.3.7.5","label":"Data optimization \u2014 c","def":"[The organization shall specify data optimization processes that:] validate that optimised data still meets the data specification","broader":"AidgoReq_7_3_7_5","collection":"AidgoDataOptimizationReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_7_5"},{"id":"AidgoConjReq_7.3.7.5_Rd","clause":"7.3.7.5","label":"Data optimization \u2014 d","def":"[The organization shall specify data optimization processes that:] maintain a record of all optimisation operations applied","broader":"AidgoReq_7_3_7_5","collection":"AidgoDataOptimizationReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_7_5"},{"id":"AidgoConjReq_7.3.7.6_Ra","clause":"7.3.7.6","label":"Support commitment \u2014 a","def":"[The organization shall document all support commitments in a support agreement that covers:] scope of support","broader":"AidgoReq_7_3_7_6_R2","collection":"AidgoSupportCommitmentReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_7_6_R2"},{"id":"AidgoConjReq_7.3.7.6_Rb","clause":"7.3.7.6","label":"Support commitment \u2014 b","def":"[The organization shall document all support commitments in a support agreement that covers:] response times and service levels","broader":"AidgoReq_7_3_7_6_R2","collection":"AidgoSupportCommitmentReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_7_6_R2"},{"id":"AidgoConjReq_7.3.7.6_Rc","clause":"7.3.7.6","label":"Support commitment \u2014 c","def":"[The organization shall document all support commitments in a support agreement that covers:] versioning and update policy","broader":"AidgoReq_7_3_7_6_R2","collection":"AidgoSupportCommitmentReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_7_6_R2"},{"id":"AidgoConjReq_7.3.7.6_Rd","clause":"7.3.7.6","label":"Support commitment \u2014 d","def":"[The organization shall document all support commitments in a support agreement that covers:] conditions for withdrawal of data","broader":"AidgoReq_7_3_7_6_R2","collection":"AidgoSupportCommitmentReqColl","type":"conjreq","decomposes":"AidgoReq_7_3_7_6_R2"},{"id":"AidgoConjReq_8.3.3.3_Ra","clause":"8.3.3.3","label":"Change request spec \u2014 a","def":"[Each change request shall specify:] the data item or process affected","broader":"AidgoReq_8_3_3_3","collection":"AidgoChangeRequestSpecReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_3"},{"id":"AidgoConjReq_8.3.3.3_Rb","clause":"8.3.3.3","label":"Change request spec \u2014 b","def":"[Each change request shall specify:] the reason for the change","broader":"AidgoReq_8_3_3_3","collection":"AidgoChangeRequestSpecReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_3"},{"id":"AidgoConjReq_8.3.3.3_Rc","clause":"8.3.3.3","label":"Change request spec \u2014 c","def":"[Each change request shall specify:] the proposed change","broader":"AidgoReq_8_3_3_3","collection":"AidgoChangeRequestSpecReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_3"},{"id":"AidgoConjReq_8.3.3.3_Rd","clause":"8.3.3.3","label":"Change request spec \u2014 d","def":"[Each change request shall specify:] the requestor and date","broader":"AidgoReq_8_3_3_3","collection":"AidgoChangeRequestSpecReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_3"},{"id":"AidgoConjReq_8.3.3.4_Ra","clause":"8.3.3.4","label":"Change request analysis \u2014 a","def":"[Change requests shall be analysed to determine:] impact on data quality","broader":"AidgoReq_8_3_3_4","collection":"AidgoChangeRequestAnalysisReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_4"},{"id":"AidgoConjReq_8.3.3.4_Rb","clause":"8.3.3.4","label":"Change request analysis \u2014 b","def":"[Change requests shall be analysed to determine:] impact on dependent datasets, processes and plans","broader":"AidgoReq_8_3_3_4","collection":"AidgoChangeRequestAnalysisReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_4"},{"id":"AidgoConjReq_8.3.3.4_Rc","clause":"8.3.3.4","label":"Change request analysis \u2014 c","def":"[Change requests shall be analysed to determine:] risks introduced by the change","broader":"AidgoReq_8_3_3_4","collection":"AidgoChangeRequestAnalysisReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_4"},{"id":"AidgoConjReq_8.3.3.4_Rd","clause":"8.3.3.4","label":"Change request analysis \u2014 d","def":"[Change requests shall be analysed to determine:] alternative solutions","broader":"AidgoReq_8_3_3_4","collection":"AidgoChangeRequestAnalysisReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_4"},{"id":"AidgoConjReq_8.3.3.4_Re","clause":"8.3.3.4","label":"Change request analysis \u2014 e","def":"[Change requests shall be analysed to determine:] resources required","broader":"AidgoReq_8_3_3_4","collection":"AidgoChangeRequestAnalysisReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_4"},{"id":"AidgoConjReq_8.3.3.4_Rf","clause":"8.3.3.4","label":"Change request analysis \u2014 f","def":"[Change requests shall be analysed to determine:] impact on schedule","broader":"AidgoReq_8_3_3_4","collection":"AidgoChangeRequestAnalysisReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_4"},{"id":"AidgoConjReq_8.3.3.5_Ra","clause":"8.3.3.5","label":"Change request eval \u2014 a","def":"[Change requests shall be evaluated and:] approved, with conditions if necessary","broader":"AidgoReq_8_3_3_5","collection":"AidgoChangeRequestEvalReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_5"},{"id":"AidgoConjReq_8.3.3.5_Rb","clause":"8.3.3.5","label":"Change request eval \u2014 b","def":"[Change requests shall be evaluated and:] deferred to a later stage","broader":"AidgoReq_8_3_3_5","collection":"AidgoChangeRequestEvalReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_5"},{"id":"AidgoConjReq_8.3.3.5_Rc","clause":"8.3.3.5","label":"Change request eval \u2014 c","def":"[Change requests shall be evaluated and:] rejected with justification","broader":"AidgoReq_8_3_3_5","collection":"AidgoChangeRequestEvalReqColl","type":"conjreq","decomposes":"AidgoReq_8_3_3_5"},{"id":"AidgoConjReq_10.2_Ra","clause":"10.2","label":"DQ tools \u2014 a","def":"[The organization shall manage data processing tools covering:] approved tool list with version information","broader":"AidgoReq_10_2","collection":"AidgoDataProcessingToolsReqColl","type":"conjreq","decomposes":"AidgoReq_10_2"},{"id":"AidgoConjReq_10.2_Rb","clause":"10.2","label":"DQ tools \u2014 b","def":"[The organization shall manage data processing tools covering:] tool qualification and validation","broader":"AidgoReq_10_2","collection":"AidgoDataProcessingToolsReqColl","type":"conjreq","decomposes":"AidgoReq_10_2"},{"id":"AidgoConjReq_10.2_Rc","clause":"10.2","label":"DQ tools \u2014 c","def":"[The organization shall manage data processing tools covering:] access control and licensing","broader":"AidgoReq_10_2","collection":"AidgoDataProcessingToolsReqColl","type":"conjreq","decomposes":"AidgoReq_10_2"},{"id":"AidgoConjReq_10.2_Rd","clause":"10.2","label":"DQ tools \u2014 d","def":"[The organization shall manage data processing tools covering:] backup and recovery","broader":"AidgoReq_10_2","collection":"AidgoDataProcessingToolsReqColl","type":"conjreq","decomposes":"AidgoReq_10_2"},{"id":"AidgoConjReq_10.2_Re","clause":"10.2","label":"DQ tools \u2014 e","def":"[The organization shall manage data processing tools covering:] monitoring of tool-induced data quality issues","broader":"AidgoReq_10_2","collection":"AidgoDataProcessingToolsReqColl","type":"conjreq","decomposes":"AidgoReq_10_2"},{"id":"AidgoConjReq_10.2_Rf","clause":"10.2","label":"DQ tools \u2014 f","def":"[The organization shall manage data processing tools covering:] tool change management","broader":"AidgoReq_10_2","collection":"AidgoDataProcessingToolsReqColl","type":"conjreq","decomposes":"AidgoReq_10_2"},{"id":"AidgoConjReq_10.2_Rg","clause":"10.2","label":"DQ tools \u2014 g","def":"[The organization shall manage data processing tools covering:] documentation of tool-specific data quality constraints","broader":"AidgoReq_10_2","collection":"AidgoDataProcessingToolsReqColl","type":"conjreq","decomposes":"AidgoReq_10_2"},{"id":"AidgoConjReq_11.2_Ra","clause":"11.2","label":"DQ dependencies \u2014 a","def":"[The organization shall manage data quality dependencies by:] identifying all data quality dependencies between datasets and processes","broader":"AidgoReq_11_2","collection":"AidgoDQDependenciesReqColl","type":"conjreq","decomposes":"AidgoReq_11_2"},{"id":"AidgoConjReq_11.2_Rb","clause":"11.2","label":"DQ dependencies \u2014 b","def":"[The organization shall manage data quality dependencies by:] documenting the impact of dependency failures on data quality","broader":"AidgoReq_11_2","collection":"AidgoDQDependenciesReqColl","type":"conjreq","decomposes":"AidgoReq_11_2"},{"id":"AidgoConjReq_11.2_Rc","clause":"11.2","label":"DQ dependencies \u2014 c","def":"[The organization shall manage data quality dependencies by:] specifying mitigation strategies for dependency-related quality risks","broader":"AidgoReq_11_2","collection":"AidgoDQDependenciesReqColl","type":"conjreq","decomposes":"AidgoReq_11_2"}],"legalReqs":[{"id":"AiaPrReq_10.1","label":"High-risk AI systems shall use datasets meeting quality criteria","def":"High-risk AI systems shall be developed on the basis of training, validation and testing data sets that meet the quality criteria referred to in paragraphs 2 to 5.","type":"legal"},{"id":"AiaPrReq_10.2_1","label":"Datasets shall be subject to appropriate data governance practices","def":"Training, validation and testing data sets shall be subject to data governance and management practices appropriate for the intended purpose.","type":"legal"},{"id":"AiaPrReq_10.2_2","label":"Governance shall concern relevant design choices","def":"[Data governance and management practices shall concern in particular] the relevant design choices.","type":"legal"},{"id":"AiaPrReq_10.2_3","label":"Governance shall concern data collection processes and origin","def":"[Data governance and management practices shall concern in particular] data collection processes and the origin of data, and in the case of personal data, the original purpose of the data collection.","type":"legal"},{"id":"AiaPrReq_10.2_4","label":"Governance shall concern data-preparation operations","def":"[Data governance and management practices shall concern in particular] relevant data-preparation processing operations, such as annotation, labelling, cleaning, updating, enrichment and aggregation.","type":"legal"},{"id":"AiaPrReq_10.2_5","label":"Governance shall concern formulation of assumptions","def":"[Data governance and management practices shall concern in particular] the formulation of assumptions, in particular with respect to the information that the data is supposed to measure and represent.","type":"legal"},{"id":"AiaPrReq_10.2_6","label":"Governance shall concern assessment of dataset availability and suitability","def":"[Data governance and management practices shall concern in particular] an assessment of the availability, quantity and suitability of the data sets that are needed.","type":"legal"},{"id":"AiaPrReq_10.2_7","label":"Governance shall concern examination for biases affecting health, safety, rights","def":"[Data governance and management practices shall concern in particular] an examination of possible biases that could affect health and safety or lead to discrimination prohibited under Union law.","type":"legal"},{"id":"AiaPrReq_10.2_8","label":"Governance shall concern identification of data gaps and shortcomings","def":"[Data governance and management practices shall concern in particular] the identification of any data gaps or shortcomings, and how those gaps and shortcomings can be addressed.","type":"legal"},{"id":"AiaPrReq_10.3_1","label":"Datasets shall be sufficiently representative","def":"Training, validation and testing data sets shall be sufficiently representative for the intended purpose.","type":"legal"},{"id":"AiaPrReq_10.3_2","label":"Datasets shall have appropriate statistical properties for persons/groups","def":"Datasets shall have the appropriate statistical properties, including as regards the persons or groups of persons on which the high-risk AI system is intended to be used.","type":"legal"},{"id":"AiaPrReq_10.4","label":"Datasets shall account for characteristics of the deployment setting","def":"Datasets shall take into account the characteristics particular to the geographical, contextual, behavioural or functional setting of intended use.","type":"legal"},{"id":"AiaPrReq_10.5","label":"Special categories personal data may be processed for bias detection","def":"Providers may process special categories of personal data strictly necessary for bias detection, subject to appropriate safeguards.","type":"legal"},{"id":"AiaPrReq_10.5_a","label":"Bias cannot be fulfilled by synthetic/anonymised data alternatives","def":"Ensuring bias detection cannot effectively be fulfilled by processing other categories of data, including synthetic or anonymised data.","type":"legal"},{"id":"AiaPrReq_10.5_b","label":"Special data subject to technical limitations and state-of-art security measures","def":"Special categories data subject to technical limitations on re-use and state-of-the-art security and privacy-preserving measures.","type":"legal"},{"id":"AiaPrReq_10.5_e","label":"Special data deleted when bias corrected or retention period ends","def":"The data shall be deleted once the bias has been corrected or the retention period has expired.","type":"legal"},{"id":"AiaPrReq_10.6","label":"For non-training AI, paragraphs 2-5 apply only to testing datasets","def":"For high-risk AI not using training techniques, paragraphs 2-5 apply only to the testing data sets.","type":"legal"}],"mappings":[{"id":"Map_10.1_7.3.2.1","legalId":"AiaPrReq_10.1","legalLabel":"High-risk AI systems shall use datasets meeting quality criteria","techId":"AidgoReq_7_3_2_1","techLabel":"Data specification General","alignType":"PartiallySatisfies","basis":"FunctionalEquivalence","justification":"ISO 5259-3 \u00a77.3.2.1 requires a data specification validated as consistent and complete for intended use, functionally aligning with Art 10(1). Gap: ISO 5259 is sector-neutral and does not specifically","gap":"ISO 5259-3 does not reference the high-risk AI regulatory classification or the specific quality criteria in Art 10(2)-(5)."},{"id":"Map_10.1_7.3.3.1","legalId":"AiaPrReq_10.1","legalLabel":"High-risk AI systems shall use datasets meeting quality criteria","techId":"AidgoReq_7_3_3_1","techLabel":"Data quality plan General","alignType":"PartiallySatisfies","basis":"ConceptualCoverage","justification":"ISO 5259-3 \u00a77.3.3.1 requires a DQ plan covering processes throughout the data life cycle, supporting Art 10(1). Gap: ISO does not require the plan to demonstrate compliance with a regulation.","gap":"The DQ plan is not required to reference regulatory compliance or demonstrate that datasets satisfy a legal standard."},{"id":"Map_10.2.1_6.3.2","legalId":"AiaPrReq_10.2_1","legalLabel":"Datasets shall be subject to appropriate data governance practices","techId":"AidgoReq_6_3_2","techLabel":"Data quality culture","alignType":"CompletelySatisfies","basis":"SemanticEquivalence","justification":"ISO 5259-3 \u00a76.3.2 directly requires rules and processes to achieve data quality, DQM implementation, integration into management processes, and communication of policies (sub-items a-h). This complete","gap":""},{"id":"Map_10.2.1_7.3.1.1_Rb","legalId":"AiaPrReq_10.2_1","legalLabel":"Governance practices appropriate for intended purpose","techId":"AidgoConjReq_7.3.1.1_Rb","techLabel":"Data motivation \u2014 specify intended use","alignType":"CompletelySatisfies","basis":"SemanticEquivalence","justification":"ISO 5259-3 \u00a77.3.1.1(b) directly requires documenting scope, purpose and intended use. This completely satisfies the 'appropriate for intended purpose' element of Art 10(2).","gap":""},{"id":"Map_10.2.2_7.3.2.2","legalId":"AiaPrReq_10.2_2","legalLabel":"Governance shall concern relevant design choices","techId":"AidgoReq_7_3_2_2","techLabel":"Data format specification","alignType":"PartiallySatisfies","basis":"ScopeOverlap","justification":"ISO 5259-3 \u00a77.3.2.2 requires specifying dataset design parameters, partially covering Art 10(2)(a) design choices. Gap: Art 10(2)(a) includes AI model and algorithm design choices beyond dataset forma","gap":"AI model architecture and algorithm selection \u2014 the AI system design choices sense \u2014 are outside ISO 5259 scope."},{"id":"Map_10.2.3_7.3.4.3","legalId":"AiaPrReq_10.2_3","legalLabel":"Governance shall concern data collection processes and origin","techId":"AidgoReq_7_3_4_3","techLabel":"Data collection","alignType":"PartiallySatisfies","basis":"ScopeOverlap","justification":"ISO 5259-3 \u00a77.3.4.3 requires documenting reasons for collection, method and specification, covering collection processes and origin. Gap: ISO does not require the original purpose of personal data col","gap":"The original purpose of personal data collection as a GDPR-grounded requirement is not addressed by ISO 5259-3."},{"id":"Map_10.2.3_7.3.4.2","legalId":"AiaPrReq_10.2_3","legalLabel":"Governance shall concern data origin","techId":"AidgoReq_7_3_4_2","techLabel":"Data source delegation responsibility","alignType":"PartiallySatisfies","basis":"ScopeOverlap","justification":"ISO 5259-3 \u00a77.3.4.2 requires taking into account licensing and reuse conditions, partially covering data origin. Gap: ISO does not require documenting provenance at the individual-collection-purpose l","gap":"Provenance of personal data at the individual collection purpose level is not addressed by ISO 5259-3."},{"id":"Map_10.2.4_7.3.5.2","legalId":"AiaPrReq_10.2_4","legalLabel":"Governance shall concern data-preparation operations","techId":"AidgoReq_7_3_5_2","techLabel":"Data cleaning","alignType":"PartiallySatisfies","basis":"ScopeOverlap","justification":"ISO 5259-3 \u00a77.3.5.2 comprehensively covers data cleaning operations. Gap: Art 10(2)(c) requires documentation of annotation and labelling processes, which ISO 5259-3 does not explicitly mandate.","gap":"Annotation and labelling as formally documented data-preparation operations are not explicitly required by ISO 5259-3."},{"id":"Map_10.2.4_7.3.6.1","legalId":"AiaPrReq_10.2_4","legalLabel":"Governance shall concern data enrichment and augmentation","techId":"AidgoReq_7_3_6_1","techLabel":"Data augmentation specify processes","alignType":"CompletelySatisfies","basis":"SemanticEquivalence","justification":"ISO 5259-3 \u00a77.3.6.1 directly requires specifying data augmentation processes (covering enrichment and aggregation), completely satisfying Art 10(2)(c)'s enrichment/aggregation sub-element.","gap":""},{"id":"Map_10.2.5_7.3.2.3_R2","legalId":"AiaPrReq_10.2_5","legalLabel":"Governance shall concern formulation of assumptions","techId":"AidgoReq_7_3_2_3_R2","techLabel":"Statistical properties representativeness","alignType":"PartiallySatisfies","basis":"ConceptualCoverage","justification":"ISO 5259-3 \u00a77.3.2.3 requires specifying statistical properties and representativeness, implicitly addressing what data represents. Gap: ISO does not require explicitly documenting measurement assumpti","gap":"Explicit documentation of measurement assumptions (what the data is supposed to measure and represent) is not a distinct ISO 5259-3 requirement."},{"id":"Map_10.2.6_7.3.1.1_Ra","legalId":"AiaPrReq_10.2_6","legalLabel":"Governance shall concern assessment of dataset availability and suitability","techId":"AidgoConjReq_7.3.1.1_Ra","techLabel":"Data motivation document data need","alignType":"PartiallySatisfies","basis":"ScopeOverlap","justification":"ISO 5259-3 \u00a77.3.1.1(a) requires documenting the motivation and origin of the data need, partially covering Art 10(2)(e). Gap: ISO does not require a formal prior assessment of availability, quantity a","gap":"A formal documented assessment of dataset availability, quantity and suitability before acquisition is not explicitly required by ISO 5259-3."},{"id":"Map_10.2.7_7.3.5.2_Rd","legalId":"AiaPrReq_10.2_7","legalLabel":"Governance shall concern examination for biases affecting health, safety, rights","techId":"AidgoConjReq_7.3.5.2_Rd","techLabel":"Data cleaning bias and drift","alignType":"PartiallySatisfies","basis":"ScopeOverlap","justification":"ISO 5259-3 \u00a77.3.5.2(d) requires bias and drift detection/mitigation measures. Gap: Art 10(2)(f) frames bias examination around health, safety, fundamental rights and anti-discrimination \u2014 legal-rights","gap":"Fundamental rights and anti-discrimination framing of bias examination is outside ISO 5259 scope."},{"id":"Map_10.2.7_8.3.4_R1","legalId":"AiaPrReq_10.2_7","legalLabel":"Governance shall concern examination for possible biases","techId":"AidgoReq_8_3_4_R1","techLabel":"Risk management conduct assessment","alignType":"PartiallySatisfies","basis":"ConceptualCoverage","justification":"ISO 5259-3 \u00a78.3.4 requires risk assessment covering data quality risks including bias. Gap: ISO risk management does not address risks to fundamental rights or anti-discrimination under Union law.","gap":"ISO 5259-3 risk management does not address risks to fundamental rights or discrimination under Union law."},{"id":"Map_10.2.8_8.3.4_R2","legalId":"AiaPrReq_10.2_8","legalLabel":"Governance shall concern identification of data gaps and shortcomings","techId":"AidgoReq_8_3_4_R2","techLabel":"Risk management minimise risks","alignType":"PartiallySatisfies","basis":"FunctionalEquivalence","justification":"ISO 5259-3 \u00a78.3.4 requires identifying and mitigating data quality risks, functionally covering data gap identification. Gap: Art 10(2)(g/h) requires explicitly documenting gaps and HOW they will be a","gap":"The gap-documentation obligation (document gaps and the plan to address them) as a distinct governance item is not explicit in ISO 5259-3."},{"id":"Map_10.3.1_7.3.2.3_R2","legalId":"AiaPrReq_10.3_1","legalLabel":"Datasets shall be sufficiently representative","techId":"AidgoReq_7_3_2_3_R2","techLabel":"Statistical properties representativeness","alignType":"CompletelySatisfies","basis":"SemanticEquivalence","justification":"ISO 5259-3 \u00a77.3.2.3 directly requires maintaining representativeness with respect to the target population for each subset. This completely satisfies Art 10(3)'s representativeness requirement.","gap":""},{"id":"Map_10.3.1_7.3.5.2_Ra_Rb","legalId":"AiaPrReq_10.3_1","legalLabel":"Datasets shall be free of errors and complete","techId":"AidgoReq_7_3_5_2","techLabel":"Data cleaning","alignType":"CompletelySatisfies","basis":"SemanticEquivalence","justification":"ISO 5259-3 \u00a77.3.5.2(a)-(c) requires measures for missing data (completeness), duplication and outliers (error-freeness). This completely satisfies Art 10(3)'s error-free and completeness requirements.","gap":""},{"id":"Map_10.3.1_7.3.1.1_Rb","legalId":"AiaPrReq_10.3_1","legalLabel":"Datasets shall be relevant for intended purpose","techId":"AidgoConjReq_7.3.1.1_Rb","techLabel":"Data motivation specify intended use","alignType":"CompletelySatisfies","basis":"SemanticEquivalence","justification":"ISO 5259-3 \u00a77.3.1.1(b) requires specifying scope, purpose and intended use, directly ensuring relevance. This completely satisfies Art 10(3)'s relevance requirement.","gap":""},{"id":"Map_10.3.2_7.3.2.3_R1","legalId":"AiaPrReq_10.3_2","legalLabel":"Datasets shall have appropriate statistical properties for persons/groups","techId":"AidgoReq_7_3_2_3_R1","techLabel":"Statistical properties subset divisions","alignType":"PartiallySatisfies","basis":"ScopeOverlap","justification":"ISO 5259-3 \u00a77.3.2.3 covers statistical properties per subset. Gap: ISO does not specifically require properties to account for the specific persons/groups the AI system is used on.","gap":"The fairness/demographic dimension \u2014 statistical properties adequate for specific persons/groups the AI system is used on \u2014 is absent from ISO 5259-3."},{"id":"Map_10.4_7.3.1.1_Rb","legalId":"AiaPrReq_10.4","legalLabel":"Datasets shall account for characteristics of the deployment setting","techId":"AidgoConjReq_7.3.1.1_Rb","techLabel":"Data motivation specify intended use","alignType":"PartiallySatisfies","basis":"ConceptualCoverage","justification":"ISO 5259-3 \u00a77.3.1.1(b) requires specifying scope and intended use, implicitly encompassing deployment setting. Gap: ISO does not explicitly require characterising geographical, behavioural or function","gap":"Explicit characterisation of geographical, contextual, behavioural and functional deployment setting is not required by ISO 5259-3."},{"id":"Map_10.5_NoAlignment","legalId":"AiaPrReq_10.5","legalLabel":"Special categories personal data may be processed for bias detection","techId":"rdf:nil","techLabel":"","alignType":"NoAlignment","basis":"GapIdentified","justification":"ISO 5259 has no provision for special categories of personal data processing. This is a legal obligation under GDPR Article 9 \u2014 structurally outside ISO 5259 scope.","gap":"Requires GDPR Art.9 + ISO/IEC 27701 compliance. ISO 5259 cannot satisfy this obligation."},{"id":"Map_10.5.a_NoAlignment","legalId":"AiaPrReq_10.5_a","legalLabel":"Bias cannot be fulfilled by synthetic/anonymised data alternatives","techId":"rdf:nil","techLabel":"","alignType":"NoAlignment","basis":"GapIdentified","justification":"ISO 5259 does not require demonstrating necessity of processing personal data over synthetic alternatives. This is a legal necessity test specific to data protection law.","gap":"GDPR proportionality principle \u2014 necessity test for personal data over synthetic alternatives \u2014 is outside ISO 5259 scope. Recommended: GDPR Art.9; AI Act Art.10(5)(a)."},{"id":"Map_10.5.b_NoAlignment","legalId":"AiaPrReq_10.5_b","legalLabel":"Special data subject to technical limitations and state-of-art security measures","techId":"rdf:nil","techLabel":"","alignType":"NoAlignment","basis":"GapIdentified","justification":"ISO 5259 does not impose pseudonymisation or state-of-art security measures as normative requirements. ISO 5259-4 mentions data privacy conceptually but not at the normative level Art 10(5)(b) require","gap":"Pseudonymisation, state-of-art security, strict GDPR access controls outside ISO 5259 scope. Recommended: ISO/IEC 27001; ISO/IEC 27701; ENISA AI Cybersecurity Guidelines."},{"id":"Map_10.5.e_7.3.8.3","legalId":"AiaPrReq_10.5_e","legalLabel":"Special data deleted when bias corrected or retention period ends","techId":"AidgoReq_7_3_8_3_R1","techLabel":"Data deletion from all storage","alignType":"PartiallySatisfies","basis":"FunctionalEquivalence","justification":"ISO 5259-3 \u00a77.3 // ═══ GRAPH CONSTRUCTION ══════════════════════════════════════════════════════
const nodes = [];
const links = [];
const nodeById = {};

// Alignment type → visual class
const ATYPE_CLASS = {
  CompletelySatisfies:'cs', PartiallySatisfies:'ps',
  RelatedTo:'rt', ConflictsWith:'cw', NoAlignment:'na'
};
const ATYPE_COLOUR = {
  CompletelySatisfies:'#22c55e', PartiallySatisfies:'#f59e0b',
  RelatedTo:'#60a5fa', ConflictsWith:'#ff6b35', NoAlignment:'#ef4444'
};

function addNode(d) {
  if (!nodeById[d.id]) {
    nodeById[d.id] = d;
    nodes.push(d);
  }
}

function addLink(source, target, type, data={}) {
  if (nodeById[source] && nodeById[target]) {
    links.push({source, target, type, ...data});
  }
}

// Add legal requirements
KG.legalReqs.forEach(n => addNode({...n, nodeType:'legal', r:10}));

// Add ISO collections
KG.collections.forEach(n => addNode({...n, nodeType:'collection', r:7}));

// Add requirements
KG.requirements.forEach(n => addNode({...n, nodeType:'requirement', r:7}));

// Add ConjReqs
KG.conjReqs.forEach(n => addNode({...n, nodeType:'conjreq', r:5}));

// Add ISO concepts
KG.concepts.forEach(n => addNode({...n, nodeType:'concept', r:5}));

// ── Build hierarchy links ─────────────────────────────────────────────────
// Collection → parent collection
KG.collections.forEach(c => {
  if (c.broader && nodeById[c.broader])
    addLink(c.id, c.broader, 'broader');
});

// Requirement → collection
KG.requirements.forEach(r => {
  const target = r.broader || r.collection;
  if (target && nodeById[target])
    addLink(r.id, target, 'broader');
});

// ConjReq → parent Requirement (tair:decomposes)
KG.conjReqs.forEach(c => {
  if (c.decomposes && nodeById[c.decomposes])
    addLink(c.id, c.decomposes, 'decomp');
  // Also to collection
  const coll = c.collection || c.broader;
  if (coll && nodeById[coll])
    addLink(c.id, coll, 'broader');
});

// Concept → broader concept
KG.concepts.forEach(c => {
  if (c.broader && nodeById[c.broader])
    addLink(c.id, c.broader, 'broader');
});

// ── Alignment links ───────────────────────────────────────────────────────
KG.mappings.forEach(m => {
  // Ensure legal node exists
  if (!nodeById[m.legalId]) {
    addNode({id:m.legalId, label:m.legalLabel, def:'', type:'legal', nodeType:'legal', r:10});
  }
  const atype = m.alignType;
  const techId = m.techId;
  if (techId && techId !== 'rdf:nil' && nodeById[techId]) {
    addLink(techId, m.legalId, 'align', {
      alignType: atype,
      alignClass: ATYPE_CLASS[atype] || 'na',
      basis: m.basis,
      justification: m.justification,
      gap: m.gap,
      mappingId: m.id
    });
  } else if (techId === 'rdf:nil' || !techId) {
    // NoAlignment — attach a dummy null node to show the gap
    const nullId = 'gap_' + m.legalId;
    if (!nodeById[nullId]) {
      addNode({id:nullId, label:'GAP', def:m.gap, nodeType:'gap', r:6});
    }
    addLink(nullId, m.legalId, 'align', {
      alignType: 'NoAlignment', alignClass: 'na',
      justification: m.justification, gap: m.gap
    });
  }
});

console.log(`Nodes: ${nodes.length}, Links: ${links.length}`);

// ═══ FILTER STATE ════════════════════════════════════════════════════════════
const visibleTypes = new Set(['legal','collection','requirement','conjreq','concept','gap']);
const visibleAligns = new Set(['CompletelySatisfies','PartiallySatisfies','RelatedTo','ConflictsWith','NoAlignment']);
let showLabels = false;
let physicsOn = true;
let selectedNode = null;
let searchQuery = '';

const NODE_TYPES = [
  {type:'legal',    label:'Legal Req',     colour:'#fb923c', shape:'dot'},
  {type:'collection',label:'Collection',   colour:'#a78bfa', shape:'hex'},
  {type:'requirement',label:'tair:Req',    colour:'#2dd4bf', shape:'dot'},
  {type:'conjreq',  label:'ConjReq',       colour:'#67e8f9', shape:'dot'},
  {type:'concept',  label:'Concept',       colour:'#86efac', shape:'dia'},
  {type:'gap',      label:'Gap (NoAlign)', colour:'#ef4444', shape:'dot'},
];

const EDGE_TYPES = [
  {type:'cs', align:'CompletelySatisfies', label:'CompletelySatisfies', colour:'#22c55e'},
  {type:'ps', align:'PartiallySatisfies',  label:'PartiallySatisfies',  colour:'#f59e0b'},
  {type:'rt', align:'RelatedTo',           label:'RelatedTo',           colour:'#60a5fa'},
  {type:'cw', align:'ConflictsWith',       label:'ConflictsWith',       colour:'#ff6b35'},
  {type:'na', align:'NoAlignment',         label:'NoAlignment',         colour:'#ef4444'},
];

// ═══ BUILD FILTER UI ═════════════════════════════════════════════════════════
function buildFilters() {
  const nf = document.getElementById('node-filters');
  NODE_TYPES.forEach(nt => {
    const cnt = nodes.filter(n=>n.nodeType===nt.type).length;
    const shapeEl = nt.shape==='hex'
      ? `<div class="hex" style="background:${nt.colour}"></div>`
      : nt.shape==='dia'
      ? `<div class="dia" style="background:${nt.colour}"></div>`
      : `<div class="dot" style="background:${nt.colour}"></div>`;
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.type = nt.type;
    btn.innerHTML = `${shapeEl}<span class="filter-label">${nt.label}</span><span class="filter-count">${cnt}</span>`;
    btn.onclick = () => toggleNodeType(nt.type, btn);
    nf.appendChild(btn);
  });

  const ef = document.getElementById('edge-filters');
  EDGE_TYPES.forEach(et => {
    const cnt = links.filter(l=>l.alignType===et.align).length;
    const btn = document.createElement('button');
    btn.className = 'edge-btn';
    btn.dataset.align = et.align;
    btn.innerHTML = `<div class="edge-line" style="background:${et.colour}"></div><span class="edge-label">${et.label}</span><span class="edge-count">${cnt}</span>`;
    btn.onclick = () => toggleAlignType(et.align, btn);
    ef.appendChild(btn);
  });
}

function toggleNodeType(type, btn) {
  if (visibleTypes.has(type)) visibleTypes.delete(type);
  else visibleTypes.add(type);
  btn.classList.toggle('off', !visibleTypes.has(type));
  refreshVisibility();
}

function toggleAlignType(align, btn) {
  if (visibleAligns.has(align)) visibleAligns.delete(align);
  else visibleAligns.add(align);
  btn.classList.toggle('off', !visibleAligns.has(align));
  refreshVisibility();
}

function updateStats() {
  const sg = document.getElementById('stats-grid');
  sg.innerHTML = '';
  const stats = [
    {n:nodes.filter(n=>n.nodeType==='legal').length,     l:'Legal Reqs'},
    {n:nodes.filter(n=>n.nodeType==='requirement').length,l:'ISO Reqs'},
    {n:nodes.filter(n=>n.nodeType==='conjreq').length,   l:'ConjReqs'},
    {n:nodes.filter(n=>n.nodeType==='collection').length, l:'Collections'},
    {n:nodes.filter(n=>n.nodeType==='concept').length,    l:'Concepts'},
    {n:links.filter(l=>l.type==='align').length,          l:'Mappings'},
  ];
  stats.forEach(s => {
    sg.innerHTML += `<div class="stat-box"><div class="stat-n">${s.n}</div><div class="stat-l">${s.l}</div></div>`;
  });
}

// ═══ D3 FORCE SIMULATION ═════════════════════════════════════════════════════
const svg = d3.select('#kg-canvas');
const wrap = document.getElementById('canvas-wrap');
let W = wrap.clientWidth, H = wrap.clientHeight;
svg.attr('width', W).attr('height', H);

const g = svg.append('g');

// Zoom
const zoom = d3.zoom()
  .scaleExtent([.1, 8])
  .on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Arrow markers for alignment edges
const defs = svg.append('defs');
Object.entries(ATYPE_COLOUR).forEach(([type, colour]) => {
  defs.append('marker')
    .attr('id', 'arrow-' + ATYPE_CLASS[type])
    .attr('viewBox','0 -3 8 6').attr('refX',14).attr('refY',0)
    .attr('markerWidth',5).attr('markerHeight',5)
    .attr('orient','auto')
    .append('path').attr('d','M0,-3L8,0L0,3').attr('fill',colour);
});

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d=>d.id)
    .distance(d => {
      if (d.type==='decomp') return 35;
      if (d.type==='broader') return 50;
      if (d.type==='uses') return 60;
      if (d.type==='align') return 120;
      return 60;
    })
    .strength(d => {
      if (d.type==='decomp') return 0.8;
      if (d.type==='broader') return 0.5;
      if (d.type==='align') return 0.3;
      return 0.4;
    }))
  .force('charge', d3.forceManyBody()
    .strength(d => d.nodeType==='conjreq' ? -60 : d.nodeType==='concept' ? -40 : -120))
  .force('center', d3.forceCenter(W/2, H/2))
  .force('x', d3.forceX().x(d => {
    if (d.nodeType==='legal') return W * 0.15;
    if (d.nodeType==='collection') return W * 0.55;
    if (d.nodeType==='requirement') return W * 0.65;
    if (d.nodeType==='conjreq') return W * 0.75;
    if (d.nodeType==='concept') return W * 0.88;
    if (d.nodeType==='gap') return W * 0.12;
    return W / 2;
  }).strength(0.12))
  .force('collision', d3.forceCollide().radius(d => (d.r||6)+4));

// Draw links
const linkSel = g.selectAll('.link')
  .data(links).enter().append('line').attr('class', d => {
    if (d.type==='decomp') return 'link link-decomp';
    if (d.type==='broader') return 'link link-broader';
    if (d.type==='uses') return 'link link-uses';
    return `link link-${d.alignClass||'na'}`;
  })
  .attr('marker-end', d => d.type==='align' ? `url(#arrow-${d.alignClass||'na'})` : null)
  .style('opacity', 0.6);

// Draw nodes
const nodeSel = g.selectAll('.node')
  .data(nodes).enter().append('g').attr('class','node')
  .call(d3.drag()
    .on('start', dragStart)
    .on('drag',  dragged)
    .on('end',   dragEnd))
  .on('mouseover', onHover)
  .on('mouseout',  onHoverOut)
  .on('click', onNodeClick);

// Node shapes
nodeSel.each(function(d) {
  const sel = d3.select(this);
  const colour = nodeColour(d);
  const r = d.r || 6;
  if (d.nodeType==='collection') {
    // Hexagon
    const pts = hexPoints(r);
    sel.append('polygon').attr('points', pts).attr('fill', colour)
       .attr('stroke', '#0a0e1a').attr('stroke-width', 1);
  } else if (d.nodeType==='concept') {
    // Diamond
    sel.append('rect').attr('width', r*1.4).attr('height', r*1.4)
       .attr('x', -r*0.7).attr('y', -r*0.7)
       .attr('transform','rotate(45)')
       .attr('fill', colour).attr('stroke','#0a0e1a').attr('stroke-width',1);
  } else {
    sel.append('circle').attr('r', r).attr('fill', colour)
       .attr('stroke', '#0a0e1a').attr('stroke-width', 1.5);
  }
});

// Node labels (hidden by default)
const labelSel = g.selectAll('.node-label')
  .data(nodes).enter().append('text').attr('class','node-label')
  .style('display','none')
  .text(d => (d.label||d.id||'').slice(0,18));

function hexPoints(r) {
  return Array.from({length:6}, (_,i) => {
    const a = (i*60-30)*Math.PI/180;
    return `${r*Math.cos(a)},${r*Math.sin(a)}`;
  }).join(' ');
}

function nodeColour(d) {
  const m = {legal:'#fb923c',collection:'#a78bfa',requirement:'#2dd4bf',
             conjreq:'#67e8f9',concept:'#86efac',gap:'#ef4444'};
  return m[d.nodeType] || '#64748b';
}

// Tick
simulation.on('tick', () => {
  linkSel
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  labelSel.attr('transform', d => `translate(${d.x},${d.y+18})`);
});

// ═══ DRAG ═════════════════════════════════════════════════════════════════════
function dragStart(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
function dragEnd(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ═══ HOVER ════════════════════════════════════════════════════════════════════
function onHover(event, d) {
  const tt = document.getElementById('tooltip');
  document.getElementById('tt-type').textContent = d.nodeType.toUpperCase();
  document.getElementById('tt-id').textContent = d.id;
  document.getElementById('tt-label').textContent = d.label || d.id;
  tt.style.display = 'block';
  tt.style.left = (event.offsetX + 14) + 'px';
  tt.style.top  = (event.offsetY - 10) + 'px';
}
function onHoverOut() {
  document.getElementById('tooltip').style.display = 'none';
}

// ═══ CLICK → DETAIL PANEL ════════════════════════════════════════════════════
function onNodeClick(event, d) {
  event.stopPropagation();
  selectedNode = d;
  renderDetail(d);
  highlightNeighbours(d);
}

svg.on('click', () => {
  selectedNode = null;
  clearHighlight();
  renderDetail(null);
});

function highlightNeighbours(d) {
  const connectedIds = new Set([d.id]);
  const connectedLinks = new Set();
  links.forEach((l, i) => {
    const sid = l.source.id||l.source;
    const tid = l.target.id||l.target;
    if (sid===d.id||tid===d.id) {
      connectedIds.add(sid); connectedIds.add(tid);
      connectedLinks.add(i);
    }
  });
  nodeSel.classed('faded', nd => !connectedIds.has(nd.id));
  nodeSel.classed('highlighted', nd => nd.id===d.id);
  linkSel.classed('faded', (_, i) => !connectedLinks.has(i));
  linkSel.classed('highlighted', (_, i) => connectedLinks.has(i));
}

function clearHighlight() {
  nodeSel.classed('faded',false).classed('highlighted',false);
  linkSel.classed('faded',false).classed('highlighted',false);
}

function renderDetail(d) {
  const title = document.getElementById('detail-title');
  const sub = document.getElementById('detail-sub');
  const body = document.getElementById('detail-body');

  if (!d) {
    title.textContent = 'Node Inspector';
    sub.textContent = 'Click any node to inspect';
    body.innerHTML = '<div class="detail-empty">Select a node in the graph to inspect its properties, connections, and alignment data.</div>';
    return;
  }

  const typeLabel = {legal:'Legal Requirement',collection:'Requirement Collection',
    requirement:'tair:Requirement',conjreq:'tair:ConjuntiveRequirement',
    concept:'Concept',gap:'Gap Marker'}[d.nodeType]||d.nodeType;
  title.textContent = d.id;
  sub.textContent = typeLabel;

  let html = '';
  const prop = (k,v,mono=false) => v ? `<div class="prop-row"><div class="prop-key">${k}</div><div class="prop-val${mono?' mono':''}">${v}</div></div>` : '';

  html += prop('ID', d.id, true);
  html += prop('Label', d.label||d.id);
  if (d.clause) html += prop('Clause', d.clause, true);
  if (d.source) html += prop('Source', d.source, true);
  if (d.broader) html += prop('skos:broader', d.broader, true);
  if (d.decomposes) html += prop('tair:decomposes', d.decomposes, true);
  if (d.def) html += prop('Definition', d.def);

  // Alignment info if legal
  if (d.nodeType==='legal') {
    const myMappings = links.filter(l => (l.target.id||l.target)===d.id && l.type==='align');
    if (myMappings.length) {
      html += '<div class="prop-row"><div class="prop-key">Alignments</div><div class="connected-list">';
      myMappings.forEach(l => {
        const cls = `badge badge-${l.alignClass||'na'}`;
        const srcId = l.source.id||l.source;
        html += `<div class="connected-item" onclick="focusNode('${srcId}')">
          <span class="${cls}">${l.alignType}</span> ${srcId}</div>`;
      });
      html += '</div></div>';
    }
  }

  // For tech requirements — show which legal reqs they map to
  if (d.nodeType==='requirement'||d.nodeType==='conjreq') {
    const myAligns = links.filter(l => (l.source.id||l.source)===d.id && l.type==='align');
    if (myAligns.length) {
      html += '<div class="prop-row"><div class="prop-key">Maps to Legal</div><div class="connected-list">';
      myAligns.forEach(l => {
        const cls = `badge badge-${l.alignClass||'na'}`;
        const tgtId = l.target.id||l.target;
        html += `<div class="connected-item" onclick="focusNode('${tgtId}')">
          <span class="${cls}">${l.alignType||'?'}</span> ${tgtId}
          ${l.justification ? `<div style="font-size:9px;color:var(--muted);margin-top:2px">${l.justification.slice(0,80)}…</div>` : ''}
        </div>`;
      });
      html += '</div></div>';
    }
    // For conjreq — show parent
    const decomp = links.filter(l => (l.source.id||l.source)===d.id && l.type==='decomp');
    if (decomp.length) {
      const pid = decomp[0].target.id||decomp[0].target;
      html += prop('Parent Req', `<span class="connected-item" onclick="focusNode('${pid}')" style="display:inline">${pid}</span>`);
    }
    // Children
    const children = links.filter(l => (l.target.id||l.target)===d.id && l.type==='decomp');
    if (children.length) {
      html += `<div class="prop-row"><div class="prop-key">ConjReqs (${children.length})</div><div class="connected-list">`;
      children.slice(0,6).forEach(l => {
        const sid = l.source.id||l.source;
        html += `<div class="connected-item" onclick="focusNode('${sid}')">${sid}</div>`;
      });
      if (children.length>6) html += `<div style="font-size:9px;color:var(--muted);padding:4px 8px">+${children.length-6} more</div>`;
      html += '</div></div>';
    }
  }

  // For collections — show member requirements
  if (d.nodeType==='collection') {
    const members = links.filter(l => (l.target.id||l.target)===d.id && l.type==='broader');
    if (members.length) {
      html += `<div class="prop-row"><div class="prop-key">Members (${members.length})</div><div class="connected-list">`;
      members.slice(0,8).forEach(l => {
        const sid = l.source.id||l.source;
        html += `<div class="connected-item" onclick="focusNode('${sid}')">${sid}</div>`;
      });
      if (members.length>8) html += `<div style="font-size:9px;color:var(--muted);padding:4px 8px">+${members.length-8} more</div>`;
      html += '</div></div>';
    }
  }

  body.innerHTML = html;
}

function focusNode(id) {
  const d = nodeById[id];
  if (!d) return;
  selectedNode = d;
  renderDetail(d);
  highlightNeighbours(d);
  // Pan to node
  const scale = d3.zoomTransform(svg.node()).k;
  svg.transition().duration(400).call(
    zoom.transform,
    d3.zoomIdentity.translate(W/2 - d.x*scale, H/2 - d.y*scale).scale(scale)
  );
}

// ═══ VISIBILITY ═══════════════════════════════════════════════════════════════
function refreshVisibility() {
  nodeSel.style('display', d => visibleTypes.has(d.nodeType) ? null : 'none');
  linkSel.style('display', l => {
    const sid = l.source.id||l.source;
    const tid = l.target.id||l.target;
    const sn = nodeById[sid], tn = nodeById[tid];
    if (!sn||!tn) return 'none';
    if (!visibleTypes.has(sn.nodeType)||!visibleTypes.has(tn.nodeType)) return 'none';
    if (l.type==='align' && !visibleAligns.has(l.alignType)) return 'none';
    return null;
  });
}

// ═══ CONTROLS ════════════════════════════════════════════════════════════════
function togglePhysics() {
  physicsOn = !physicsOn;
  const btn = document.getElementById('btn-physics');
  if (physicsOn) { simulation.alphaTarget(0.1).restart(); btn.classList.add('active'); }
  else { simulation.alphaTarget(0).stop(); btn.classList.remove('active'); }
}

function toggleLabels() {
  showLabels = !showLabels;
  const btn = document.getElementById('btn-labels');
  btn.classList.toggle('active', showLabels);
  labelSel.style('display', showLabels ? null : 'none');
}

function resetCamera() {
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
}

function onSearch(q) {
  searchQuery = q.toLowerCase().trim();
  if (!searchQuery) { clearHighlight(); return; }
  const matches = new Set();
  nodes.forEach(n => {
    const idL = (n.id||'').toLowerCase();
    const labL = (n.label||'').toLowerCase();
    if (idL.includes(searchQuery)||labL.includes(searchQuery)) matches.add(n.id);
  });
  nodeSel.classed('faded', d => !matches.has(d.id));
  nodeSel.classed('highlighted', d => matches.has(d.id));
  linkSel.classed('faded', l => {
    const sid = l.source.id||l.source;
    const tid = l.target.id||l.target;
    return !matches.has(sid)&&!matches.has(tid);
  });
}

function exportSVG() {
  const svgEl = document.getElementById('kg-canvas');
  const s = new XMLSerializer().serializeToString(svgEl);
  const blob = new Blob([s], {type:'image/svg+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'aidgo_knowledge_graph.svg';
  a.click();
}

// ═══ RESIZE ══════════════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  W = wrap.clientWidth; H = wrap.clientHeight;
  svg.attr('width',W).attr('height',H);
  simulation.force('center', d3.forceCenter(W/2,H/2));
  simulation.force('x', d3.forceX().x(d => {
    if (d.nodeType==='legal') return W * 0.15;
    if (d.nodeType==='collection') return W * 0.55;
    if (d.nodeType==='requirement') return W * 0.65;
    if (d.nodeType==='conjreq') return W * 0.75;
    if (d.nodeType==='concept') return W * 0.88;
    return W / 2;
  }).strength(0.12));
  simulation.alpha(0.3).restart();
});

// ═══ INIT ════════════════════════════════════════════════════════════════════
buildFilters();
updateStats();

// Slow cool-down after 3s
setTimeout(() => simulation.alphaTarget(0), 3000);
</script>
</body>
