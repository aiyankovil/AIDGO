name: AIDGO pipeline

on:
  push:
  pull_request:

jobs:
  build-validate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build, validate, query, analyse
        run: python -m aidgo_tools all
      - name: Committed outputs are up to date
        run: |
          if [ -n "$(git status --porcelain -- output/ index.html aidgo_knowledge_graph.html)" ]; then
            git status --porcelain; echo "::error::Generated files are stale or uncommitted. Run 'make' and commit."; exit 1
          fi
      - name: Tests
        run: python -m pytest -q
